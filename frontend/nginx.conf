# Rendered by the nginx entrypoint from /etc/nginx/templates/default.conf.template.
# ${FRONTEND_PORT} and ${BACKEND_UPSTREAM} are substituted at container start.

upstream opencam_backend {
    server ${BACKEND_UPSTREAM};
    keepalive 32;
}

server {
    # Bind address is explicit: nginx proxies /api and /ws to the backend, so
    # listening on 0.0.0.0 re-exposes to the LAN the very API we just bound to
    # loopback. Widen FRONTEND_BIND only together with OPENCAM_API_TOKEN.
    listen      ${FRONTEND_BIND}:${FRONTEND_PORT};
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # WebRTC/WS payloads are small; SDP bodies are a few KB at most.
    client_max_body_size 1m;

    # --- security headers ---
    # The app is entirely self-hosted: no third-party scripts, styles or fonts,
    # and the only network targets are this origin plus WebRTC (which CSP does
    # not govern). That makes a strict policy cheap to hold.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "no-referrer" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # getUserMedia stays available to this origin; everything else is refused.
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;
    server_tokens off;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        # `default_type`, not `add_header`: see the note below about inheritance.
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- REST + WHIP signalling -------------------------------------------
    location /api/ {
        proxy_pass         http://opencam_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        # Carry the bearer token through to the backend when auth is enabled.
        proxy_set_header   Authorization     $http_authorization;

        # SDP exchange blocks on ICE gathering; do not cut it short.
        proxy_read_timeout 30s;
        proxy_buffering    off;
    }

    # --- metadata websocket -----------------------------------------------
    location /ws/ {
        proxy_pass         http://opencam_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;

        # Inference JSON must arrive frame-by-frame, never batched.
        proxy_buffering    off;
        proxy_cache        off;
        # Long idle timeout: a session can sit quiet between publishers.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- static assets -----------------------------------------------------
    # NOTE: `add_header` is inherited only when the current level declares none
    # of its own -- one `add_header` here would drop every security header set
    # above. Cache policy is therefore expressed with `expires`, which sets
    # Cache-Control without touching add_header inheritance.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        # SPA fallback: the session id lives in the URL hash.
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
